<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Outer Rim Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#f97316" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.6" />
    </linearGradient>

    <!-- Shield / Pin Gradient -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff782e" />
      <stop offset="45%" stop-color="#f95716" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Alert / Core Glow Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Radar Pulse Gradient -->
    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Emerald GPS Fix Gradient -->
    <linearGradient id="gpsFixGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f97316" flood-opacity="0.4" />
    </filter>

    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="gpsGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="118" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="118" fill="none" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Tactical Radar Rings -->
  <g opacity="0.25">
    <circle cx="256" cy="256" r="185" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="10 8" />
    <circle cx="256" cy="256" r="135" fill="none" stroke="#38bdf8" stroke-width="2" />
    <circle cx="256" cy="256" r="85" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6" />
    <line x1="256" y1="65" x2="256" y2="447" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 6" />
    <line x1="65" y1="256" x2="447" y2="256" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 6" />
  </g>

  <!-- Radar Sweep Cone -->
  <path d="M 256 256 L 390 122 A 185 185 0 0 1 441 256 Z" fill="url(#radarSweep)" opacity="0.6" />

  <!-- Hero Symbol: Tactical Field Risk Pin & Protective Shield Fusion -->
  <g filter="url(#shieldShadow)">
    <!-- Outer Safety Shield Outline -->
    <path d="M 256 82 C 322 82 376 122 376 186 C 376 274 274 382 256 400 C 238 382 136 274 136 186 C 136 122 190 82 256 82 Z"
          fill="url(#pinGrad)" />

    <!-- Pin Inner Bevel & Depth Layer -->
    <path d="M 256 94 C 314 94 362 130 362 186 C 362 262 272 358 256 376 C 240 358 150 262 150 186 C 150 130 198 94 256 94 Z"
          fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="4" />

    <!-- High-tech Inner Dark Core Badge -->
    <circle cx="256" cy="186" r="66" fill="#0b1120" stroke="#fde047" stroke-width="5" stroke-opacity="0.85" />

    <!-- Warning / Hazard Exclamation & Energy Pulse Icon in the Core -->
    <g filter="url(#coreGlow)">
      <!-- Hazard Exclamation Mark (Field Risk Alert) -->
      <path d="M 246 142 L 266 142 L 262 196 L 250 196 Z" fill="url(#coreGrad)" />
      <circle cx="256" cy="214" r="8" fill="url(#coreGrad)" />
    </g>
  </g>

  <!-- GPS Online Satellite Beacon Status Dot (Top Right of Pin) -->
  <g filter="url(#gpsGlow)">
    <circle cx="360" cy="120" r="26" fill="#047857" opacity="0.4" />
    <circle cx="360" cy="120" r="18" fill="url(#gpsFixGrad)" stroke="#ffffff" stroke-width="4" />
    <circle cx="360" cy="120" r="6" fill="#ffffff" />
  </g>
</svg>
